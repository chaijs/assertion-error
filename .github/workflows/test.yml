name: Test Deno Module

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        deno-version: [2.6.3, canary]

    steps:
      - name: Git sources
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Use Deno Version ${{ matrix.deno-version }}
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: ${{ matrix.deno-version }}

      - name: Deno Check Fmt
        run: deno fmt --check

      - name: Deno Lint
        run: deno lint

      - name: Build Deno Module
        run: deno bundle --reload mod.ts > index.js

      - name: Test Deno Module
        run: deno test --coverage=coverage

      # TODO: coverage broken see https://github.com/denoland/deno/issues/11875
      # - name: Generate lcov
      #   run: deno coverage coverage --lcov > coverage/lcov.info

      # - name: Assert coverage is good
      #   uses: VeryGoodOpenSource/very_good_coverage@v1.2.0
